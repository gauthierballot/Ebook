<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Ebook — tes livres papier, dans ta poche</title>
  <meta name="description" content="Photographie les pages de tes livres papier et lis-les sur ton téléphone.">
  <meta name="theme-color" content="#2447C8" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#0E1222" media="(prefers-color-scheme: dark)">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Ebook">

  <!-- Favicon : un « E » calligraphié, en texte, dans un SVG inline -->
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='16' fill='%232447C8'/%3E%3Ctext x='50%25' y='54%25' text-anchor='middle' dominant-baseline='middle' font-family='Pinyon Script, Great Vibes, Snell Roundhand, Apple Chancery, Brush Script MT, cursive' font-size='50' fill='white'%3EE%3C/text%3E%3C/svg%3E">

  <!-- Thème appliqué avant l'affichage pour éviter un flash blanc en mode sombre -->
  <script>
    (function () {
      try {
        var choix = localStorage.getItem('ebook-theme');
        var sombre = choix ? choix === 'sombre' : window.matchMedia('(prefers-color-scheme: dark)').matches;
        document.documentElement.dataset.theme = sombre ? 'sombre' : 'clair';
      } catch (e) { document.documentElement.dataset.theme = 'clair'; }
    })();
  </script>

  <!-- Polices Google : logo (script), titres (Playfair Display), interface (Inter) -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Pinyon+Script&family=Playfair+Display:ital,wght@0,500;0,600;1,500&display=swap">

  <link rel="stylesheet" href="css/style.css">
  <script type="module" src="js/app.js"></script>
</head>
<body>
  <a class="lien-evitement" href="#contenu">Aller au contenu</a>

  <!-- Bandeau hors ligne -->
  <div id="hors-ligne" class="hors-ligne" role="status" hidden>
    Tu es hors ligne. Les livres déjà ouverts restent lisibles.
  </div>

  <!-- En-tête -->
  <header class="entete" id="entete">
    <div class="entete-interieur">
      <a href="#/bibliotheque" class="marque" aria-label="Ebook, retour à la bibliothèque">
        <span class="logo-e" aria-hidden="true">E</span>
        <span class="marque-nom">Ebook</span>
      </a>

      <nav class="nav-haut" aria-label="Navigation principale">
        <a href="#/bibliotheque" data-nav="bibliotheque">Bibliothèque</a>
        <a href="#/ajouter" data-nav="ajouter">Ajouter</a>
        <a href="#/recommandations" data-nav="recommandations">Conseils</a>
        <a href="#/compte" data-nav="compte">Compte</a>
      </nav>

      <button type="button" class="btn-icone" id="bascule-theme" aria-label="Activer le mode sombre">
        <svg class="ico-lune" viewBox="0 0 24 24" aria-hidden="true"><path d="M20 14.5A8 8 0 0 1 9.5 4a8 8 0 1 0 10.5 10.5Z"/></svg>
        <svg class="ico-soleil" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
      </button>
    </div>
  </header>

  <!-- Contenu de la vue courante (rempli par le routeur) -->
  <main id="contenu" class="contenu" tabindex="-1">
    <div class="etat-chargement" role="status">
      <span class="roue" aria-hidden="true"></span>
      <p>Ouverture de ta bibliothèque…</p>
    </div>
    <noscript><p class="carte">Ebook a besoin de JavaScript pour fonctionner.</p></noscript>
  </main>

  <!-- Pied de page -->
  <footer class="pied" id="pied">
    <p>
      <span class="logo-e petit" aria-hidden="true">E</span>
      Ebook — projet personnel, sans publicité.
      <a href="#/confidentialite">Confidentialité &amp; mentions légales</a>
    </p>
  </footer>

  <!-- Barre d'onglets (mobile) -->
  <nav class="onglets" id="onglets" aria-label="Navigation principale">
    <a href="#/bibliotheque" data-nav="bibliotheque">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 5.5A1.5 1.5 0 0 1 5.5 4H9v16H5.5A1.5 1.5 0 0 1 4 18.5Z"/><path d="M9 4h4v16H9z"/><path d="m15 5 3.6-.9a1 1 0 0 1 1.2.7l2.9 12.8a1 1 0 0 1-.7 1.2L18.4 20Z"/></svg>
      <span>Bibliothèque</span>
    </a>
    <a href="#/ajouter" data-nav="ajouter">
      <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="6" width="18" height="14" rx="3"/><circle cx="12" cy="13" r="3.5"/><path d="M8 6l1.5-2h5L16 6"/></svg>
      <span>Ajouter</span>
    </a>
    <a href="#/recommandations" data-nav="recommandations">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M20 15a2 2 0 0 1-2 2H8l-4 4V5a2 2 0 0 1 2-2h12a2 2 0 0 1 2 2Z"/></svg>
      <span>Conseils</span>
    </a>
    <a href="#/compte" data-nav="compte">
      <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="8" r="4"/><path d="M4 21a8 8 0 0 1 16 0"/></svg>
      <span>Compte</span>
    </a>
  </nav>

  <!-- Notifications -->
  <div id="toasts" class="toasts" aria-live="polite" aria-atomic="true"></div>

  <!-- Boîte de confirmation réutilisable -->
  <dialog id="dialogue" class="dialogue" aria-labelledby="dialogue-titre">
    <form method="dialog">
      <h2 id="dialogue-titre" class="titre-3"></h2>
      <p id="dialogue-texte"></p>
      <div class="actions">
        <button value="annuler" class="btn btn-secondaire">Annuler</button>
        <button value="ok" class="btn btn-danger" id="dialogue-ok">Confirmer</button>
      </div>
    </form>
  </dialog>
</body>
</html>
